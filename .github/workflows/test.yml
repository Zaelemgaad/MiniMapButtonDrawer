name: Lua checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - run: lua5.1 tests/run.lua
